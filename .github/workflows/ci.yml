name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: 后端（构建 + 分析器闸门）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ShineMusicApi
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 还原依赖
        run: dotnet restore ShineMusic.slnx

      # Directory.Build.props 已开启 TreatWarningsAsErrors + NetAnalyzers，
      # 因此这一步同时是「代码质量闸门」：任何新增告警都会直接失败。
      - name: 构建（警告即错误）
        run: dotnet build ShineMusic.slnx --configuration Release --no-restore

  app:
    name: App 前端（契约漂移 + i18n 残留 + 类型检查 + App 构建）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ShineMusicApp
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: ShineMusicApp/yarn.lock

      # 契约生成器是 Python 脚本：显式固定解释器，不依赖 runner 镜像自带的 python。
      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # --frozen-lockfile：yarn.lock 与 package.json 不一致时直接失败，
      # 防止依赖漂移悄悄溜进构建。
      - name: 安装依赖
        run: yarn install --frozen-lockfile

      # 契约漂移检测：重新跑一遍生成器，与仓库中的 api.generated.ts 比对。
      # 后端改了 DTO 却没重新生成/提交前端契约时，这里失败。
      # 生成器同时校验 App 与 Web 两份契约，内容必须完全一致。
      - name: 检查契约是否与后端一致
        run: yarn check:contracts

      - name: 类型检查（vue-tsc --noEmit）
        run: yarn typecheck

      # i18n 防回退闸门：新增 UI 中文串必须进语言包并接线，
      # 基线 = 有意保留的逻辑匹配值白名单（见 scripts/i18n-residual-baseline.json）。
      - name: i18n 残留检查
        run: yarn check:i18n

      # App 工程只产 App 产物（APK 的 web 资源），不再构建 H5。
      - name: 构建 App
        run: yarn build:app

      - name: 上传构建产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-dist
          path: ShineMusicApp/dist/build/app/**
          if-no-files-found: warn

  web:
    name: Web 前端（契约漂移 + 类型检查 + 构建）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ShineMusicWeb
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: ShineMusicWeb/yarn.lock

      # 与 App 共用同一个 Python 契约生成器，显式固定解释器版本。
      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: yarn install --frozen-lockfile

      # 与 App 共用同一个契约生成器：任一前端漂移都会在这里失败。
      - name: 检查契约是否与后端一致
        run: yarn check:contracts

      - name: 类型检查（vue-tsc --noEmit）
        run: yarn typecheck

      - name: 构建（独立站点产物）
        run: yarn build:only

      - name: 上传构建产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: ShineMusicWeb/dist/**
          if-no-files-found: warn
