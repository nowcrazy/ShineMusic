<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f6f2" />
    <title>Shine Music</title>
    <script>
      // TODO: 临时调试用错误收集器,验证后删除
      window.__errs = [];
      window.addEventListener('error', (e) => { window.__errs.push(String(e.message) + ' @ ' + String(e.filename) + ':' + e.lineno); });
      window.addEventListener('unhandledrejection', (e) => { window.__errs.push('rejection: ' + String((e.reason && e.reason.message) || e.reason)); });
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
