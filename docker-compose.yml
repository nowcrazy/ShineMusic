# 本机开发基础设施。为避免开发服务误暴露到局域网/公网，所有宿主机端口仅绑定回环地址。
# 运行前从根目录 .env.example 创建 .env，并填入唯一生成的随机口令；该文件由 Git 忽略。
name: shinemusic

services:
  postgres:
    image: postgres:16-alpine
    container_name: shinemusic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shinemusic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      POSTGRES_DB: shinemusic
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shinemusic -d shinemusic"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: shinemusic-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in the root .env file}
    # Expand the container environment at runtime so the password is not written into the Compose command text.
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: shinemusic-rabbitmq
    # Keep the existing hostname during upgrades: RabbitMQ stores data under its node name.
    hostname: ${RABBITMQ_HOSTNAME:-shinemusic-rabbitmq}
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: shinemusic
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in the root .env file}
      TZ: UTC
    ports:
      - "127.0.0.1:5672:5672"    # AMQP
      - "127.0.0.1:15672:15672"  # 管理台；默认仅本机访问
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
